# docker-java configuration for Testcontainers.
#
# Docker Engine 29 rejects API versions below 1.40 (verified live against
# Docker Desktop 4.77 / Engine 29.5.3: /v1.32/info returns HTTP 400 while
# /v1.40/info returns 200), and docker-java's built-in default (1.32) makes
# Testcontainers report "Docker is not available", which silently skips every
# container-backed integration test.
#
# 1.40 is the lowest version accepted by new engines and is still supported by
# Docker Engine 19.03 through 29.x, so it is the broadest compatible pin.
# The acceptance scripts may override this with -Dapi.version when a daemon
# advertises a different supported range.
api.version=1.40
