# DriftWatch Tower — streaming data quality observability
# Single-node demo config; all services run via docker-compose

spring:
  application:
    name: driftwatch-tower
  datasource:
    url: jdbc:postgresql://localhost:5432/driftwatch
    username: driftwatch
    password: driftwatch
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: driftwatch-tower
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.driftwatch.event
        spring.json.value.default.type: com.driftwatch.event.DataEvent
    listener:
      missing-topics-fatal: false
    streams:
      application-id: driftwatch-streams
      properties:
        commit.interval.ms: 1000
        spring.json.trusted.packages: com.driftwatch.event,com.driftwatch.quality,com.driftwatch.stream
        spring.json.value.default.type: com.driftwatch.stream.ProcessedEvent

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Detector configuration — all thresholds are externalized here
driftwatch:
  # Kafka Streams quality topology. The legacy RawEventConsumer/QualityProcessor path has been
  # retired — the streams topology + QualityEventSink are now the only processing path.
  streams:
    enabled: true
  detector:
    duplicate:
      payload-window: PT5M
    late:
      threshold: PT5M
    null-spike:
      # 0.6/3 rather than 0.2/5 so the null-spike demo fires: it needs prevRate <= threshold
      # while the current window is still short of min-samples (see plan, Flaw #5).
      threshold: 0.6
      min-samples: 3
    anomaly-spike:
      baseline-windows: 2
      min-history-windows: 2
      ratio-threshold: 3.0
      min-current-count: 5
    field-range:
      fields:
        price:
          min: 0
          max: 1000
    field-format:
      patterns: 'code=^SKU-[0-9]{6}$'
  source-health:
    default-stale-after: PT5M
    rss-stale-after: PT30M
    pipeline-stale-after: PT24H

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: driftwatch-tower
  endpoint:
    health:
      show-details: always
