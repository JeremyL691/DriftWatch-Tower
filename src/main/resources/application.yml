# DriftWatch Tower — streaming data quality observability.
#
# Credentials are never defaulted in this file. Pick a profile:
#   dev       local development defaults (never use for a deployment)
#   selfhost  self-host deployment; requires env-provided credentials and enables the live
#             GitHub public-event collector (see docker-compose.yml and .env.example)
#   test/load used by the test suites and load harness
#
# The execution guide (`docs/PROJECT_EXECUTION_GUIDE.md`) defines the contract for these keys.

spring:
  application:
    name: driftwatch-tower
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/driftwatch}
    username: ${SPRING_DATASOURCE_USERNAME:driftwatch}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    streams:
      application-id: driftwatch-streams-v1
      properties:
        commit.interval.ms: 1000
    listener:
      missing-topics-fatal: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Anonymous callers of /actuator/health receive the status only.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db,kafka,streams,diskSpace
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: driftwatch-tower

driftwatch:
  streams:
    enabled: true
  detector:
    duplicate:
      payload-window: PT5M
    late:
      threshold: PT5M
      # GitHub's events API can lag by hours; the source-specific threshold is larger.
      github-threshold: PT8H
    null-spike:
      threshold: 0.6
      min-samples: 3
    anomaly-spike:
      baseline-windows: 2
      min-history-windows: 2
      ratio-threshold: 3.0
      min-current-count: 5
    field-range:
      fields:
        price:
          min: 0
          max: 1000
    field-format:
      patterns: 'code=^SKU-[0-9]{6}$'
  metrics:
    window-size: PT1M
    grace: PT10M
    future-tolerance: PT2M
    # Must be >= grace + (baseline-windows + 1) * window-size; checked at startup.
    state-retention: PT15M
  source-health:
    default-stale-after: PT5M
    rss-stale-after: PT30M
    pipeline-stale-after: PT24H
    # Collector lost after max(this, 2x its legal poll interval).
    collector-lost-after: PT15M
  security:
    admin:
      username: driftwatch
      # No default: dev/test profiles and the self-host env file provide the value.
      password: ""
    ingest-tokens: []
    require-strong-credentials: false
  source:
    github:
      enabled: false
