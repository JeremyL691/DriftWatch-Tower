<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- background -->
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- title -->
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#26221C">DRIFTWATCH TOWER ARCHITECTURE</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#6b6b6b">Kafka-backed streaming data-quality observability pipeline</text>

  <!-- node style: dark box, bronze-gold accent -->
  <!-- A: REST API -->
  <rect x="20" y="80" width="190" height="76" rx="10" fill="#26221C"/>
  <text x="115" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">REST API</text>
  <text x="115" y="130" text-anchor="middle" font-size="9.5" fill="#d8d3c5">POST /api/v1/events</text>
  <text x="115" y="144" text-anchor="middle" font-size="9.5" fill="#d8d3c5">POST /api/v1/demo/run-scenario/*</text>

  <!-- B: raw-events topic -->
  <rect x="270" y="80" width="170" height="76" rx="10" fill="#3a352c"/>
  <text x="355" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Kafka topic</text>
  <text x="355" y="128" text-anchor="middle" font-size="10.5" fill="#f0c75e">raw-events</text>
  <text x="355" y="144" text-anchor="middle" font-size="9" fill="#d8d3c5">produced by EventController</text>

  <!-- C: Kafka Streams quality topology -->
  <rect x="500" y="60" width="380" height="116" rx="10" fill="#1f3a5f"/>
  <text x="690" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Kafka Streams quality topology</text>
  <text x="690" y="102" text-anchor="middle" font-size="9.5" fill="#cfe0f5">windowed state stores · duplicates · late events · schema drift</text>
  <text x="690" y="116" text-anchor="middle" font-size="9.5" fill="#cfe0f5">null spikes · anomaly spikes · field range/format</text>
  <text x="690" y="132" text-anchor="middle" font-size="9.5" fill="#cfe0f5">Spring detector beans · stateful processors</text>
  <text x="690" y="146" text-anchor="middle" font-size="9" fill="#9db8d9">emits detector outcomes as events</text>

  <!-- D: quality-events topic -->
  <rect x="270" y="220" width="170" height="76" rx="10" fill="#3a352c"/>
  <text x="355" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Kafka topic</text>
  <text x="355" y="268" text-anchor="middle" font-size="10.5" fill="#f0c75e">quality-events</text>
  <text x="355" y="284" text-anchor="middle" font-size="9" fill="#d8d3c5">detector outcomes as events</text>

  <!-- E: Sink -->
  <rect x="500" y="220" width="380" height="76" rx="10" fill="#26221C"/>
  <text x="690" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Sink consumer</text>
  <text x="690" y="268" text-anchor="middle" font-size="9.5" fill="#d8d3c5">persist evidence · update source health · metric projection</text>
  <text x="690" y="282" text-anchor="middle" font-size="9.5" fill="#d8d3c5">WebSocket updates · Prometheus counters</text>

  <!-- F: PostgreSQL -->
  <rect x="270" y="340" width="300" height="72" rx="10" fill="#14532d"/>
  <text x="420" y="364" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">PostgreSQL 16 (Flyway-managed)</text>
  <text x="420" y="382" text-anchor="middle" font-size="9.5" fill="#cfe8d8">raw_events · quality_alerts · schema_versions</text>
  <text x="420" y="396" text-anchor="middle" font-size="9.5" fill="#cfe8d8">metric_windows · source_health</text>

  <!-- G: dashboard + REST -->
  <rect x="640" y="340" width="240" height="72" rx="10" fill="#26221C"/>
  <text x="760" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Dashboard &amp; REST APIs</text>
  <text x="760" y="384" text-anchor="middle" font-size="9.5" fill="#d8d3c5">/api/v1/alerts · /api/v1/sources/health</text>
  <text x="760" y="398" text-anchor="middle" font-size="9.5" fill="#d8d3c5">WebSocket live updates · Prometheus</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#8a8578"/>
    </marker>
  </defs>
  <line x1="210" y1="118" x2="266" y2="118" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="118" x2="496" y2="118" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="690,176 690,198 355,198 355,216" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="258" x2="496" y2="258" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="296" x2="425" y2="336" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="296" x2="760" y2="336" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574" y1="376" x2="636" y2="376" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 620 176 L 620 318 L 500 338" fill="none" stroke="#8a8578" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="536" y="319" text-anchor="middle" font-size="8.5" fill="#6b6b6b">schema baseline read/write</text>
</svg>
