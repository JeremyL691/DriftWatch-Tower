version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
