name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit and topology tests
        run: ./mvnw test -Dtest='!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false --batch-mode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surefire-unit
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore

  integration:
    name: Real Kafka and PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run container-backed integration tests
        run: ./mvnw test -Dtest='*IntegrationTest' -Ddwt.requireDocker=true --batch-mode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surefire-integration
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore

  fault-migration:
    name: Migration, retry and dead letter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run migration and fault tests
        run: >-
          ./mvnw test
          -Dtest='SchemaTransactionIntegrationTest,DeadLetterIntegrationTest,SinkRetryTest,IdempotencyIntegrationTest'
          -Ddwt.requireDocker=true --batch-mode

  image:
    name: Image and SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application image
        run: docker build --tag driftwatch-tower:ci .
      - name: Report the application content identity
        # The release pipeline refuses to publish an image whose rebuilt application bytes differ
        # from the accepted candidate. Printing the value here makes that comparison checkable on
        # the native amd64 runner, before a release is attempted.
        run: |
          container=$(docker create driftwatch-tower:ci)
          docker cp "$container:/app/app.jar" /tmp/app.jar
          docker rm -f "$container" >/dev/null
          python3 - <<'PY' | tee content-identity.txt
          import hashlib, zipfile
          digest = hashlib.sha256()
          with zipfile.ZipFile('/tmp/app.jar') as archive:
              for info in sorted(archive.infolist(), key=lambda entry: entry.filename):
                  digest.update(f"{info.filename}\0{info.file_size}\0{info.CRC}\n".encode())
          print(digest.hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-identity
          path: content-identity.txt
      - name: Scan dependencies and image (HIGH, CRITICAL)
        run: |
          docker run --rm -v "$PWD":/repo:ro aquasec/trivy:0.58.1 fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /repo
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 driftwatch-tower:ci
      - name: Scan the tracked tree for committed credentials
        run: |
          docker run --rm -v "$PWD":/repo:ro aquasec/trivy:0.58.1 fs \
            --scanners secret --exit-code 1 /repo

  browser:
    name: Dashboard at four viewports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the pinned browser
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Start the stack
        run: |
          ./scripts/selfhost.sh init --env-file .execution/ci.env
          echo "DWT_APP_PORT=18080" >> .execution/ci.env
          ./scripts/selfhost.sh up --env-file .execution/ci.env --build
      - name: Capture the dashboard in dark and light
        run: |
          source .execution/ci.env
          node scripts/p53-capture.mjs --out .execution/browser --label ci \
            --base http://127.0.0.1:18080 \
            --user "$DWT_ADMIN_USERNAME" --password "$DWT_ADMIN_PASSWORD" --themes dark,light
          python3 scripts/phases/check-dashboard.py \
            --report .execution/browser/ci-report.json --out .execution/browser/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-captures
          path: .execution/browser/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: ./scripts/selfhost.sh down --env-file .execution/ci.env --volumes
