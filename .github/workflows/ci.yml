name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and topology
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Release tool false-positive regressions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Browser health wait regressions
        run: node --test scripts/tests/browser-health.test.mjs
      - name: Run unit and topology tests
        id: unit-tests
        continue-on-error: true
        run: ./mvnw test -Dtest='!*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false --batch-mode
      - name: Verify unit and topology test reports
        if: always()
        run: |
          mkdir -p .execution/ci
          python3 scripts/phases/check-suite.py --reports target/surefire-reports \
            --out .execution/ci/unit-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surefire-unit
          path: |
            target/surefire-reports/*.xml
            .execution/ci/unit-summary.json
          if-no-files-found: ignore

  integration:
    name: Real Kafka and PostgreSQL integration
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run container-backed integration tests
        id: integration-tests
        continue-on-error: true
        run: |
          mkdir -p .execution/ci
          TEST_ORDER_SEED=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          echo "$TEST_ORDER_SEED" > .execution/ci/integration-test-order-seed.txt
          ./mvnw test -Dtest='*IntegrationTest' -Ddwt.requireDocker=true \
            -Djunit.jupiter.execution.order.random.seed="$TEST_ORDER_SEED" \
            -Ddwt.test.seed-log=.execution/ci/dead-letter-seeds.txt --batch-mode
      - name: Verify integration test reports
        if: always()
        run: |
          mkdir -p .execution/ci
          python3 scripts/phases/check-suite.py --reports target/surefire-reports \
            --out .execution/ci/integration-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surefire-integration
          path: |
            target/surefire-reports/*.xml
            .execution/ci/integration-summary.json
            .execution/ci/integration-test-order-seed.txt
            .execution/ci/dead-letter-seeds.txt
          if-no-files-found: ignore

  fault-migration:
    name: Migration, retry and dead letter
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run migration and fault tests
        id: fault-tests
        continue-on-error: true
        run: |
          mkdir -p .execution/ci
          TEST_ORDER_SEED=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          echo "$TEST_ORDER_SEED" > .execution/ci/fault-test-order-seed.txt
          ./mvnw test \
            -Dtest='SchemaTransactionIntegrationTest,DeadLetterIntegrationTest,SinkRetryTest,IdempotencyIntegrationTest' \
            -Ddwt.requireDocker=true \
            -Djunit.jupiter.execution.order.random.seed="$TEST_ORDER_SEED" \
            -Ddwt.test.seed-log=.execution/ci/dead-letter-seeds.txt --batch-mode
      - name: Verify migration and fault test reports
        if: always()
        run: |
          mkdir -p .execution/ci
          python3 scripts/phases/check-suite.py --reports target/surefire-reports \
            --out .execution/ci/fault-summary.json \
            --require com.driftwatch.quality.schema.SchemaTransactionIntegrationTest \
            --require com.driftwatch.dlt.DeadLetterIntegrationTest \
            --require com.driftwatch.stream.SinkRetryTest \
            --require com.driftwatch.event.IdempotencyIntegrationTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surefire-fault-migration
          path: |
            target/surefire-reports/*.xml
            .execution/ci/fault-summary.json
            .execution/ci/fault-test-order-seed.txt
            .execution/ci/dead-letter-seeds.txt
          if-no-files-found: ignore

  image:
    name: Image and SCA
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application image
        # Maven Central occasionally answers 5xx while the build resolves dependencies (observed
        # 2026-10-01: 502 Bad Gateway on net.bytebuddy:byte-buddy-parent). Retry the transient
        # failure; Docker reuses the layers that completed and a genuine build error still fails.
        run: |
          for attempt in 1 2 3; do
            if docker build --tag driftwatch-tower:ci .; then
              exit 0
            fi
            echo "::warning::image build attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::image build failed after 3 attempts"
          exit 1
      - name: Report the application content identity
        # The release pipeline refuses to publish an image whose rebuilt application bytes differ
        # from the accepted candidate. Printing the value here makes that comparison checkable on
        # the native amd64 runner, before a release is attempted.
        run: |
          container=$(docker create driftwatch-tower:ci)
          docker cp "$container:/app/app.jar" /tmp/app.jar
          docker rm -f "$container" >/dev/null
          python3 - <<'PY' | tee content-identity.txt
          import hashlib, zipfile
          digest = hashlib.sha256()
          with zipfile.ZipFile('/tmp/app.jar') as archive:
              for info in sorted(archive.infolist(), key=lambda entry: entry.filename):
                  digest.update(f"{info.filename}\0{info.file_size}\0{info.CRC}\n".encode())
          print(digest.hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-identity
          path: content-identity.txt
      - name: Scan dependencies and image (HIGH, CRITICAL)
        run: |
          python3 scripts/phases/check-xslt-reachability.py --image driftwatch-tower:ci --out target/xslt-reachability
          docker run --rm -v "$PWD":/repo:ro aquasec/trivy:0.58.1 fs \
            --skip-dirs /repo/target --scanners vuln --severity HIGH,CRITICAL --format json /repo > target/trivy-dependencies.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --scanners vuln --severity HIGH,CRITICAL --format json driftwatch-tower:ci > target/trivy-image.json
          python3 scripts/phases/check-xslt-reachability.py --out target/xslt-reachability \
            --scan target/trivy-dependencies.json --scan target/trivy-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: raw-security-reachability
          path: |
            target/trivy-*.json
            target/xslt-reachability/*.json
      - name: Scan the tracked tree for committed credentials
        run: |
          mkdir -p target/tracked-secret-scan
          git archive HEAD | tar -x -C target/tracked-secret-scan
          docker run --rm -v "$PWD/target/tracked-secret-scan":/repo:ro aquasec/trivy:0.58.1 fs \
            --scanners secret --exit-code 1 /repo

  browser:
    name: Dashboard at four viewports
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the pinned browser
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Start the stack
        run: |
          ./scripts/selfhost.sh init --env-file .execution/ci.env
          echo "DWT_APP_PORT=18080" >> .execution/ci.env
          ./scripts/selfhost.sh up --env-file .execution/ci.env --build
      - name: Capture the dashboard in dark and light
        id: browser
        continue-on-error: true
        run: |
          source .execution/ci.env
          node scripts/p53-capture.mjs --out .execution/browser --label ci \
            --base http://127.0.0.1:18080 \
            --user "$DWT_ADMIN_USERNAME" --password "$DWT_ADMIN_PASSWORD" --themes dark,light \
            --exercise-actions true
          python3 scripts/phases/check-dashboard.py \
            --report .execution/browser/ci-report.json --out .execution/browser/summary.json
      - name: Capture redacted stack diagnostics after browser failure
        if: always() && steps.browser.outcome == 'failure'
        run: |
          mkdir -p .execution/ci-diagnostics
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          env_file = Path('.execution/ci.env')
          values = {}
          if env_file.exists():
              for line in env_file.read_text().splitlines():
                  if '=' in line and not line.startswith('#'):
                      key, value = line.split('=', 1)
                      values[key] = value
          secrets = [value for key, value in values.items()
                     if key in {'DWT_ADMIN_PASSWORD', 'DWT_INGEST_TOKEN', 'DWT_POSTGRES_PASSWORD'} and value]
          for command, output in [
              (['docker', 'compose', '-p', 'driftwatch', '--env-file', str(env_file), 'ps', '-a'],
               '.execution/ci-diagnostics/compose-ps.txt'),
              (['docker', 'compose', '-p', 'driftwatch', '--env-file', str(env_file), 'logs', '--no-color',
                '--tail', '2000'], '.execution/ci-diagnostics/compose-logs.txt'),
          ]:
              result = subprocess.run(command, capture_output=True, text=True, check=False)
              text = (result.stdout + result.stderr)[-1_000_000:]
              for secret in secrets:
                  text = text.replace(secret, '[REDACTED]')
              Path(output).write_text(text)
          PY
      - name: Enforce browser acceptance result
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: test "$BROWSER_OUTCOME" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-captures
          path: |
            .execution/browser/
            .execution/ci-diagnostics/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: ./scripts/selfhost.sh down --env-file .execution/ci.env --volumes
